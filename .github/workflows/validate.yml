name: Validate userscript

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: node --check instagram-full-size-gallery-downloader.user.js

      - name: Validate userscript metadata and policy
        run: node scripts/validate-userscript.mjs
